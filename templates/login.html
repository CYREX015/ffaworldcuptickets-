<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - FIFA World Cup 2026 Tickets</title>
  <style>
    body { font-family: Arial, sans-serif; background: #FFD700; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-container { background: #FFFF00; border: 1px solid #ddd; border-radius: 8px; padding: 30px; max-width: 400px; text-align: center; }
    .trophy { width: 40px; height: 40px; margin: 0 10px; }
    h1 { color: #111; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #0078ff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

<div class="login-container">
  <h1>
    <img class="trophy" src="https://cdn-icons-png.flaticon.com/512/1021/1021060.png" alt="Trophy">
    Login
    <img class="trophy" src="https://cdn-icons-png.flaticon.com/512/1021/1021060.png" alt="Trophy">
  </h1>
  
  <form onsubmit="login(event)">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <button type="submit">Continue to Tickets</button>
  </form>
</div>

<script>
function login(event) {
  event.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  
  localStorage.setItem('userName', name);
  localStorage.setItem('userEmail', email);
  
  window.location.href = 'index.html';
}
</script>

</body>
</html>
